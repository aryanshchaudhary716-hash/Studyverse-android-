name: Build Studyverse APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Validate app JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No application script found');
          for (const script of scripts) new Function(script[1]);
          console.log('Validated', scripts.length, 'application script(s)');
          NODE
      - run: npm run prepare:web
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Studyverse-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
